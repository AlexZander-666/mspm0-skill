name: Validate

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python scripts
        run: >-
          python -m py_compile
          skills/mspm0-ccs/scripts/check_syscfg.py
          skills/mspm0-ccs/scripts/detect_probe.py
          skills/mspm0-ccs/scripts/serial_console.py
          skills/mspm0-ccs/scripts/index_syscfg_examples.py
          skills/mspm0-ccs/scripts/list_examples.py
          skills/mspm0-ccs/scripts/capture_example.py
          skills/mspm0-ccs/scripts/ccs_dss_debug.py
          skills/mspm0-ccs/scripts/openocd_debug.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check packaged examples
        run: python skills/mspm0-ccs/scripts/check_syscfg.py .
      - name: Read example index
        run: python skills/mspm0-ccs/scripts/list_examples.py --json
